# KPPDF 8.0 — Production stack (Ubuntu VM on Synology / bare Ubuntu)
# Canonical public origin: https://kppdf-crm.ru  (set CORS_ORIGIN accordingly)
# Secrets (JWT_*, ADMIN_PASSWORD, MONGO_URI) MUST come from host env / .env — no insecure defaults.
# Health: /api/health/ready (mongo-only) — avoids RSS/disk restart loops on small VMs.
# Up:   docker compose -f docker-compose.prod.yml up -d --build
# Logs: docker compose -f docker-compose.prod.yml logs -f backend
#
# ЕДИНАЯ БАЗА (с 2026-10-18): своей MongoDB у kppdf больше нет. Backend работает с общей
# базой `datacore` в контейнере `datacore-mongo` (контур /opt/data-core, репозиторий data-core)
# через docker-сеть `data-core_default`. Mongo-пользователь `kppdf` (readWrite на `datacore`),
# строка подключения — в .env (MONGO_URI). Загруженные файлы — общая папка data-core.
# Старые данные kppdf (/var/lib/kppdf80/mongodb) не используются и хранятся для отката.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kppdf-backend
    shm_size: "1gb"
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - default
      - datacore
    volumes:
      - ./frontend/browser:/app/frontend:ro
      # Общие загрузки с data-core: фото/файлы видны обоим приложениям.
      - ${SHARED_UPLOADS_DIR:-/var/lib/datacore/uploads}:/app/uploads
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Пример: mongodb://kppdf:<pw>@datacore-mongo:27017/datacore?directConnection=true&authSource=datacore
      MONGO_URI: "${MONGO_URI:?MONGO_URI is required (единая база datacore)}"
      MONGO_DB: "${MONGO_DB:-datacore}"
      MONGO_REPLICA_SET: rs0
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
      CORS_ORIGIN: "${CORS_ORIGIN:-https://kppdf-crm.ru}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      FRONTEND_PATH: /app/frontend
      LOG_LEVEL: info
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      DEVICE_OWNER_INVITE_TTL_MINUTES: "${DEVICE_OWNER_INVITE_TTL_MINUTES:-2880}"
      DEVICE_ENROLL_BASE_URL: "${DEVICE_ENROLL_BASE_URL:-https://kppdf-crm.ru}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health/ready', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 40s

networks:
  datacore:
    external: true
    name: data-core_default
